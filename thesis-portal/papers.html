<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papiers de Recherche - Thèse CNAM</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">&#9670;</span>
                Thèse Doctorat CNAM
            </a>
            <button class="nav-toggle" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Accueil</a></li>
                <li><a href="papers.html" class="nav-link active">Papiers</a></li>
                <li><a href="redactions.html" class="nav-link">Rédactions</a></li>
                <li><a href="profil.html" class="nav-link">Profil</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-header">
        <h1>Papiers de Recherche</h1>
        <p>Bibliothèque de papiers académiques lus et annotés dans le cadre de ma thèse.</p>
    </header>

    <main class="main-content">
        <section class="section">
            <div class="filters">
                <input type="text" id="search-papers" class="search-input" placeholder="Rechercher un papier...">
                <div class="filter-tags" id="filter-tags">
                    <button class="filter-tag active" data-filter="all">Tous</button>
                </div>
            </div>

            <div class="papers-list" id="papers-list">
                <!-- Populated by JS from data/papers.json -->
            </div>
        </section>
    </main>

    <!-- Modal for paper details -->
    <div class="modal-overlay" id="paper-modal">
        <div class="modal">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-content" id="modal-content">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 &mdash; Thèse de Doctorat, Conservatoire National des Arts et Métiers</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/papers.js"></script>
</body>
</html>
